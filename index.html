<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- General SEO -->
    <title>Supremo Dogos | Hot Dogs, Boneless, Papas &amp; Nachos</title>
    <meta name="description" content="Disfruta los mejores Dogos, Boneless, Papas y Nachos con ingredientes de calidad y sabor único. ¡Ordena ahora!">
    <link rel="canonical" href="https://convitemx9455.live-website.com/menu/">
    <link rel="icon" type="image/png" href="./images/logo.png">
    <link rel="apple-touch-icon" href="./images/logo.png">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://convitemx9455.live-website.com/menu/">
    <meta property="og:title" content="Supremo Dogos | Hot Dogs, Boneless, Papas &amp; Nachos">
    <meta property="og:description" content="Disfruta los mejores Dogos, Boneless, Papas y Nachos con ingredientes de calidad y sabor único. ¡Ordena ahora!">
    <meta property="og:image" content="https://convitemx9455.live-website.com/menu/images/social-preview1.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="Menú de Supremo Dogos con Hot Dogs Gourmet, Boneless y Papas fritas">
    <meta property="og:site_name" content="Supremo Dogos">
    <meta property="og:locale" content="es_MX">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://convitemx9455.live-website.com/menu/">
    <meta name="twitter:title" content="Supremo Dogos | Hot Dogs, Boneless, Papas &amp; Nachos">
    <meta name="twitter:description" content="Disfruta los mejores Dogos, Boneless, Papas y Nachos con ingredientes de calidad y sabor único. ¡Ordena ahora!">
    <meta name="twitter:image" content="https://convitemx9455.live-website.com/menu/images/social-preview1.jpg">
    <meta name="twitter:image:alt" content="Menú de Supremo Dogos con Hot Dogs Gourmet, Boneless y Papas fritas">
    
    <!-- Fuentes de Google Fonts: Bebas Neue para títulos/precios e Inter/Montserrat para descripciones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css?v=3.0">
</head>
<body>

    <!-- Dynamic smoke overlays for premium ambient background depth -->
    <div class="smoke-overlay" aria-hidden="true"></div>
    <div class="smoke-overlay-secondary" aria-hidden="true"></div>

    <!-- CABECERA Y NAVEGACIÓN FIJA (STICKY) - Con sello rotativo de marca -->
    <header class="main-header">
        <!-- SELLO ROTATIVO DE MARCA (Estilo Photoshop/Vector) -->
        <div class="stamp-container">
            <svg viewBox="0 0 100 100" class="stamp-svg" aria-hidden="true">
                <path id="circlePath" d="M 50, 50 m -35, 0 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" fill="none" />
                <text class="stamp-text">
                    <textPath href="#circlePath">★ SUPREMO GOURMET ★ ORIGINAL HOTDOGS</textPath>
                </text>
            </svg>
            <div class="stamp-center">★</div>
        </div>

        <!-- Se removió el width: 100% inline para permitir alineación responsiva correcta en desktop -->
        <div class="logo-wrapper">
            <!-- Contenedor alineado horizontalmente con fuerza vía estilos inline para evitar desbordes en móvil -->
            <div class="brand-container" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; flex-wrap: nowrap;">
                <!-- Logo transparente directo sin caja blanca -->
                <img src="./images/logo.png" alt="Supremodogos Logo" class="brand-logo" style="height: 28px; max-height: 28px; width: auto; object-fit: contain; display: block;">
                <!-- TÍTULO REDIMENSIONADO Y CON FORZADO EN UNA SOLA LÍNEA -->
                <h1 class="logo" style="font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; letter-spacing: 1px; font-weight: 900; line-height: 1; font-style: italic; text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.8); white-space: nowrap; margin: 0; display: flex; align-items: center;">
                    <span class="logo-accent" style="color: #FFC800; margin-right: 2px;">SUPREMODOGOS</span>MENU
                </h1>
            </div>
            <div class="logo-subtitle">DOGOS &bull; PAPAS &bull; NACHOS &bull; BONELESS</div>
        </div>

        <nav class="nav-categories" aria-label="Categorías de menú">
            <a href="#classics" class="nav-link active">Clásicos</a>
            <a href="#specialties" class="nav-link">Especialidades</a>
            <a href="#fries" class="nav-link">Papas</a>
            <a href="#boneless" class="nav-link">Boneless</a>
            <a href="#nachos" class="nav-link">Nachos</a>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL DEL MENÚ -->
    <main class="menu-container">

        <!-- ================= CATEGORÍA: CLÁSICOS ================= -->
        <section id="classics" class="menu-section">
            <!-- MARCA DE AGUA DE FONDO (Texto gigante decorativo) -->
            <div class="section-watermark" aria-hidden="true">CLASSICS</div>
            
            <div class="section-title-wrapper">
                <h2 class="section-title">Clásicos</h2>
                <div class="section-title-line"></div>
            </div>

            <div class="product-grid">
                <!-- Tarjetas generadas por menu-renderer.js desde menu-data.js -->
            </div>
        </section>

        <!-- ================= CATEGORÍA: ESPECIALIDADES ================= -->
        <section id="specialties" class="menu-section">
            <!-- MARCA DE AGUA DE FONDO -->
            <div class="section-watermark" aria-hidden="true">SPECIALS</div>

            <div class="section-title-wrapper">
                <h2 class="section-title">Especialidades</h2>
                <div class="section-title-line"></div>
            </div>

            <div class="product-grid">
                <!-- Tarjetas generadas por menu-renderer.js desde menu-data.js -->
            </div>
        </section>

        <!-- ================= CATEGORÍA: PAPAS ================= -->
        <section id="fries" class="menu-section">
            <!-- MARCA DE AGUA DE FONDO -->
            <div class="section-watermark" aria-hidden="true">FRIES</div>
            
            <div class="section-title-wrapper">
                <h2 class="section-title">Papas</h2>
                <div class="section-title-line"></div>
            </div>

            <div class="product-grid">
                <!-- Tarjetas generadas por menu-renderer.js desde menu-data.js -->
            </div>
        </section>

        <!-- ================= CATEGORÍA: BONELESS ================= -->
        <section id="boneless" class="menu-section">
            <!-- MARCA DE AGUA DE FONDO -->
            <div class="section-watermark" aria-hidden="true">BONELESS</div>
            
            <div class="section-title-wrapper">
                <h2 class="section-title">Boneless</h2>
                <div class="section-title-line"></div>
            </div>

            <div class="product-grid">
                <!-- Tarjetas generadas por menu-renderer.js desde menu-data.js -->
            </div>
        </section>

        <!-- ================= CATEGORÍA: NACHOS ================= -->
        <section id="nachos" class="menu-section">
            <!-- MARCA DE AGUA DE FONDO -->
            <div class="section-watermark" aria-hidden="true">NACHOS</div>
            
            <div class="section-title-wrapper">
                <h2 class="section-title">Nachos</h2>
                <div class="section-title-line"></div>
            </div>

            <div class="product-grid">
                <!-- Tarjetas generadas por menu-renderer.js desde menu-data.js -->
            </div>
        </section>

    </main>

    <!-- MODAL POPUP PROMOCIONAL (DISEÑO FLAT) -->
    <div id="promo-popup" class="promo-popup-overlay" aria-modal="true" role="dialog">
        <div class="promo-popup-content">
            <button class="promo-popup-close" id="close-popup" aria-label="Cerrar ventana emergente">&times;</button>
            <a href="#specialties">
                <img src="./images/popup.png" alt="Promoción Especial Supremodogos" class="promo-popup-image">
            </a>
        </div>
    </div>

    <!-- QUICK VIEW PRODUCT DETAIL MODAL -->
    <div id="quickview-modal" class="qv-modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Detalle de producto">
        <div class="qv-modal-backdrop"></div>
        <div class="qv-modal-wrapper">
            <!-- Main modal container -->
            <div class="qv-modal-box">
                <!-- Navigation arrows (Visible on both mobile & desktop, nested for relative alignment) -->
                <button class="qv-arrow qv-arrow-left" id="qv-prev-btn" aria-label="Producto anterior">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/></svg>
                </button>
                <button class="qv-arrow qv-arrow-right" id="qv-next-btn" aria-label="Producto siguiente">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor"/></svg>
                </button>

                <!-- Swipe down handle indicator for mobile bottom sheet -->
                <div class="qv-swipe-handle" aria-hidden="true"></div>
                
                <!-- Close Button -->
                <button class="qv-close-btn" id="qv-close-btn" aria-label="Cerrar detalle">&times;</button>
                
                <div class="qv-content-grid">
                    <!-- Image Viewport -->
                    <div class="qv-image-section">
                        <img src="" alt="" class="qv-large-image" id="qv-image">
                    </div>
                    
                    <!-- Text / Details -->
                    <div class="qv-details-section">
                        <div class="qv-header-info">
                            <h2 class="qv-product-name" id="qv-name"></h2>
                            
                            <!-- Contenedor para precio único (por defecto) -->
                            <div class="qv-price-single" id="qv-price-single-container">
                                <div class="qv-price-tag" id="qv-price"></div>
                            </div>
                            
                            <!-- Contenedor para precios dobles (Fries) -->
                            <div class="qv-price-double" id="qv-price-double-container" style="display: none;">
                                <div class="qv-double-badge">
                                    <span class="qv-double-label">Chica</span>
                                    <span class="qv-price-tag" id="qv-price-small"></span>
                                </div>
                                <div class="qv-double-badge">
                                    <span class="qv-double-label">Grande</span>
                                    <span class="qv-price-tag" id="qv-price-large"></span>
                                </div>
                            </div>
                        </div>
                        <p class="qv-product-description" id="qv-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--
        ORDEN DE CARGA DE SCRIPTS:
        1. menu-data.js    → define la variable global menuData (única fuente de verdad)
        2. menu-renderer.js → lee menuData e inyecta las tarjetas en los .product-grid
        3. script.js       → encuentra las tarjetas ya en el DOM y aplica interacciones
    -->
    <script src="menu-data.js"></script>
    <script src="menu-renderer.js"></script>
    <script src="script.js"></script>
</body>
</html>
