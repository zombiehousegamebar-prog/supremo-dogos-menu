<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supremo Dogos | Módulo de Impresión</title>
    <meta name="description" content="Módulo de impresión del menú físico de Supremo Dogos. Vista previa y herramienta de preparación para impresión en papel Carta.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../images/logo.png">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="print.css">
</head>
<body>

    <!-- ============================================================
         MÓDULO HEADER (Solo visible en pantalla, oculto al imprimir)
    ============================================================ -->
    <header class="print-module-header" id="print-header">
        <div class="pmh-brand">
            <img src="../images/logo.png" alt="Supremo Dogos Logo" class="pmh-logo">
            <div class="pmh-titles">
                <div class="pmh-main-title">
                    <span class="pmh-accent">SUPREMO</span>DOGOS
                </div>
                <div class="pmh-subtitle">MÓDULO DE IMPRESIÓN</div>
            </div>
        </div>
        <a href="../" class="pmh-back-link" aria-label="Volver al menú principal">
            ← Menú Web
        </a>
    </header>

    <!-- ============================================================
         CONTROLES DE NAVEGACIÓN (Solo visible en pantalla)
    ============================================================ -->
    <div class="print-controls" id="print-controls">
        <div class="pc-left">
            <div class="pc-page-info" id="page-indicator">
                Cargando páginas…
            </div>
        </div>
        <div class="pc-center">
            <button class="pc-btn pc-btn-nav" id="btn-prev" aria-label="Página anterior" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Anterior
            </button>
            <button class="pc-btn pc-btn-nav" id="btn-next" aria-label="Página siguiente">
                Siguiente
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
        <div class="pc-right">
            <button class="pc-btn pc-btn-print" id="btn-print" aria-label="Imprimir menú completo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                IMPRIMIR MENÚ
            </button>
        </div>
    </div>

    <!-- ============================================================
         ÁREA DE VISTA PREVIA (Solo visible en pantalla)
    ============================================================ -->
    <div class="print-preview-area" id="preview-area">
        <!-- Las hojas carta se generan aquí dinámicamente por print.js -->
        <div class="print-preview-viewport" id="preview-viewport">
            <!-- Estado de carga inicial -->
            <div class="preview-loading" id="preview-loading">
                <div class="preview-loading-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="13" x2="15" y2="13"></line>
                        <line x1="9" y1="17" x2="12" y2="17"></line>
                    </svg>
                </div>
                <p>Generando páginas del menú…</p>
            </div>
        </div>
    </div>

    <!-- ============================================================
         CONTENEDOR DE IMPRESIÓN
         Este contenedor es INVISIBLE en pantalla pero se muestra al imprimir.
         Contiene TODAS las páginas del menú, una por hoja carta.
    ============================================================ -->
    <div class="print-all-pages" id="print-all-pages" aria-hidden="true">
        <!-- Las hojas para impresión se generan aquí por print.js -->
    </div>

    <!-- SCRIPTS: menu-data.js primero (fuente de verdad), luego print.js -->
    <script src="../menu-data.js"></script>
    <script src="print.js"></script>

</body>
</html>
